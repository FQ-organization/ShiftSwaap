async function logoutLive(){track('logout');await flushEv();await DB.auth.signOut();resetLive();screen='login';auth={...auth,mode:'in',err:'',pw:''};render()}
function renderMsg(){paint(`<div class="login"><div class="logo">${IC('<rect x="3.5" y="5" width="17" height="15.5" rx="4.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/>')}</div><div class="sub" style="text-align:center">${screen=='offline'?'Could not reach the ShiftSwaap server. Check your connection and reload.':'Loading…'}</div></div>`+(toast?`<div class="toast" role="status">${toast}</div>`:''))}

// ---- invites ----
async function startJoinLive(){const m=jn.val.trim().match(/([a-z0-9]{8})\W*$/i);if(!m){say('That link is not valid.');return render()}
 const{data,error}=await DB.rpc('invite_preview',{p_token:m[1].toLowerCase()});if(error){say(errText(error));return render()}
 if(data.status!='ok'){say(data.status=='revoked'?'This link was revoked.':data.status=='expired'?'This link has expired.':'That link is not valid.');screen='home';return render()}
 joinInv={pv:data};jn={open:false,val:''};screen='join';render()}
function renderJoinLive(){const v=joinInv.pv;
 paint(`<div class="top"><div class="hi"><button class="back" aria-label="Back" onclick="screen='home';render()">‹</button><h1>Room invite</h1></div></div><div class="pn" style="text-align:center;margin-top:24px"><span class="ric" style="background:${v.bg};width:72px;height:72px;font-size:36px;margin:0 auto 10px;border-radius:24px">${v.icon}</span><h2>${v.name}</h2><div class="sub">Invited by ${v.invited_by||'?'} · ${v.members} members</div>${v.member?`<div class="sub ok" style="margin-top:14px">You are already in this room.</div><div class="acts" style="justify-content:center"><button class="pill" onclick="enterRoom('${v.room_id}')">Open room</button></div>`:`<div class="acts" style="justify-content:center"><button class="pill" onclick="acceptInvite()">Join room</button><button class="link q" onclick="screen='home';render()">Not now</button></div>`}</div>`+(toast?`<div class="toast" role="status">${toast}</div>`:''))}
async function acceptInviteLive(){const{data,error}=await DB.rpc('join_room',{p_token:joinInv.pv.token});if(error){say(errText(error));screen='home';return render()}
 track('invite_joined',{room:data});await reloadNow();const r=ROOMS.find(x=>x.id==data);say('Welcome to '+(r?r.name:joinInv.pv.name)+' 🎉');if(r)enterRoom(r.id,'shifts');else{screen='home';render()}}

// ---- loading and realtime ----
function subscribe(){if(chan)DB.removeChannel(chan);
 chan=DB.channel('shiftswaap-'+ME).on('postgres_changes',{event:'*',schema:'public'},p=>{
  if(p.table=='notifications'&&p.eventType=='INSERT'&&p.new&&p.new.user_id==ME&&p.new.kind!='rem'){say('🔔 '+p.new.text);try{if(typeof Notification!='undefined'&&Notification.permission=='granted')new Notification('ShiftSwaap',{body:p.new.text})}catch(e){}}
  reload()}).subscribe()}
async function loadAll(){const g=async b=>{const{data,error}=await b;if(error)throw error;return data||[]},none=Promise.resolve([]);
 const mem=await g(DB.from('room_members').select('room_id,user_id,is_admin'));
 const ids=[...new Set(mem.filter(m=>m.user_id==ME).map(m=>m.room_id))],has=ids.length>0,inR=t=>DB.from(t).select('*').in('room_id',ids),since=new Date(Date.now()-62*864e5).toISOString();
 const[profs,priv,rooms,rules,shifts,rq,ms,rx,inv,act,nt,rtags,mtags]=await Promise.all([
  g(DB.from('profiles').select('id,name,avatar,avatar_id,notify_requests')),
  g(DB.from('profile_private').select('*').eq('id',ME)),
  has?g(DB.from('rooms').select('*').in('id',ids).order('created_at')):none,
  has?g(inR('room_rules').order('created_at')):none,
  has?g(DB.from('shifts').select('id,room_id,starts_at,ends_at,shift_type,shift_members(user_id,pos)').in('room_id',ids).gte('ends_at',since).order('starts_at').limit(5000)):none,
  has?g(DB.from('requests').select('*,offers(*)').in('room_id',ids).order('seq',{ascending:false}).limit(500)):none,
  has?g(inR('messages').order('seq',{ascending:false}).limit(500)):none,
  has?g(inR('reactions')):none,
  has?g(inR('invites')):none,
  has?g(inR('activity').order('created_at',{ascending:false}).limit(100)):none,
  g(DB.from('notifications').select('*').eq('user_id',ME).order('id',{ascending:false}).limit(200)),
  has?g(inR('room_tags').order('created_at')):none,
  has?g(inR('member_tags')):none]);
 
 ALL=profs.map(p=>p.id);for(const p of profs){P[p.id]=[p.name,''];AV[p.id]=AVS[(p.avatar_id??(p.avatar|0))%AVS.length];prefs[p.id]=p.notify_requests}
 if(!P[ME]){P[ME]=['?','?'];AV[ME]=AVS[10]}
 const pv=priv[0]||{};PROF[ME]={email:pv.email||'',phone:pv.phone||'',specialty:pv.specialty||'',hospital:pv.hospital||'',department:pv.department||'',remind:pv.remind!==false,lead:pv.lead_hours||12};
 const by=(a,id)=>a.filter(x=>x.room_id==id),reacts={},sids=new Set(shifts.map(s=>s.id));for(const x of rx)(reacts[x.seq]=reacts[x.seq]||{})[x.user_id]=x.emoji;
 ROOMS=rooms.map(r=>{const rm=by(mem,r.id);
  // requests about shifts older than the loaded window are left out, since the screens look their shifts up
  const RQ=by(rq,r.id).filter(x=>sids.has(x.shift_id)).reverse().map(x=>({id:x.id,seq:x.seq,sid:x.shift_id,owner:x.owner_id,status:x.status,notified:x.notified||[],declined:x.declined||[],
   offers:(x.offers||[]).filter(f=>f.changes.every(c=>sids.has(c.sid))).sort((a,b)=>a.id-b.id).map(f=>({id:f.id,from:f.from_id,key:f.key,changes:f.changes,status:f.status})),
   reason:x.reason,imp:x.importance,sell:x.sell,price:x.price,t0:Date.parse(x.created_at),taker:x.taker_id,acc:x.accepted_offer,reacts:reacts[x.seq]}));
  return{id:r.id,name:r.name,icon:r.icon,bg:r.bg,type:r.shift_type,members:rm.map(m=>m.user_id),admins:rm.filter(m=>m.is_admin).map(m=>m.user_id),
   S:by(shifts,r.id).map(s=>({id:s.id,start:Date.parse(s.starts_at),end:Date.parse(s.ends_at),type:s.shift_type,m:(s.shift_members||[]).sort((a,b)=>a.pos-b.pos).map(x=>x.user_id)})),
   reqs:RQ,msgs:by(ms,r.id).reverse().map(m=>({u:m.user_id,seq:m.seq,text:m.text,parent:m.parent,sys:m.sys?1:0,tr:m.tr?1:0,reacts:reacts[m.seq]})),
   RULES:by(rules,r.id).map(x=>({id:x.id,name:x.name,on:x.enabled,type:x.type,n:x.n,h:x.h,per:x.per,tags:x.tags||[],conds:x.conds||[]})),
   TAGS:by(rtags,r.id).map(t=>({id:t.id,name:t.name,color:t.color})),MT:by(mtags,r.id).reduce((o,x)=>((o[x.user_id]=o[x.user_id]||[]).push(x.tag_id),o),{}),
   mode:r.approval_mode?'approval':'auto',allowSell:r.allow_sell,
   pending:RQ.filter(x=>x.status=='waiting').map(x=>({r:x,o:x.offers.find(f=>f.id==x.acc),who:x.taker})).filter(p=>p.o),
   LOG:by(act,r.id).map(a=>a.text)}});
 notifs=nt.reverse().map(n=>({id:n.id,to:n.user_id,text:n.text,imp:n.importance,sub:n.sub||'',kind:n.kind,room:n.room_id,read:n.read}));nt.forEach(n=>n.dedupe&&reminded.add(n.dedupe));
 INV=inv.map(i=>({t:i.token,room:i.room_id,by:i.created_by,exp:Date.parse(i.expires_at),uses:i.uses,revoked:i.revoked}));
 const cur=R&&R.id;R=null;const r=cur&&ROOMS.find(x=>x.id==cur);if(r)loadRoom(r);else if(screen=='room'||screen=='thread')screen='home'}
async function boot(){if(!DB){screen='offline';return render()}
 if(DEMO)for(const k in DEMO_IDS){P[DEMO_IDS[k]]=P[k];AV[DEMO_IDS[k]]=AV[k]}
 try{const u=new URL(location.href),j=u.searchParams.get('join');if(j){pendingJoin=j;u.searchParams.delete('join');history.replaceState(null,'',u.toString())}}catch(e){}
 addEventListener('pagehide',()=>{flushEv()});
 screen='loading';render();
 DB.auth.onAuthStateChange((ev,s)=>{if(ev=='SIGNED_OUT'){if(sessUid){resetLive();screen='login';render()}}else if(s&&s.user&&s.user.id!=sessUid)setTimeout(()=>onSession(s),0)});
 const{data}=await DB.auth.getSession();if(data&&data.session)onSession(data.session);else if(!sessUid){screen='login';render()}}
if(!LIVE){ROOMS=buildRooms();R=ROOMS[0];loadRoom(R);ALL.forEach(u=>{const e=nn(P[u][0]).replace(/[^a-z]/g,'')+'@hospitalcentral.example';ACCTS.push({email:e,pw:'demo1234',uid:u});pf(u).email=e});render();}else boot();
